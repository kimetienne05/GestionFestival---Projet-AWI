# Developpement (DAT section 7). Prod : docker-compose.prod.yml a ecrire plus tard.
name: festival

services:
  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      # PostgreSQL 18 : on monte /var/lib/postgresql (et non .../data)
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [festival_net]

  api:
    build:
      context: ./back
      target: dev
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: festival
      DB_NAME: festival
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-a-changer}
    volumes:
      - ./back:/app
      - /app/node_modules
      - regles:/app/regles
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks: [festival_net]

  front:
    build:
      context: ./front
      target: dev
    restart: unless-stopped
    volumes:
      - ./front:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    depends_on:
      - api
    networks: [festival_net]

networks:
  festival_net:

volumes:
  pgdata:
  regles:
